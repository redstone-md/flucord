name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
            throw "Release tag must use exact vMAJOR.MINOR.PATCH syntax: $tag"
          }
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)(?:\+\d+)?\s*$'
          if ($versionLine.Matches.Count -ne 1) {
            throw 'pubspec.yaml must contain exactly one semantic version.'
          }
          $projectVersion = $versionLine.Matches[0].Groups[1].Value
          if ($projectVersion -ne $Matches.version) {
            throw "Tag $tag does not match pubspec version $projectVersion."
          }
          $tagType = git cat-file -t $tag
          if ($tagType -notin @('tag', 'commit')) {
            throw "Tag $tag does not resolve to a Git tag or commit."
          }

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          precache-windows: "true"

      - name: Audit public repository history
        run: ./tool/audit_public_repository.ps1

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package release and checksums
        id: package
        run: |
          $tag = '${{ github.ref_name }}'
          $releaseDirectory = Resolve-Path 'build/windows/x64/runner/Release'
          $distributionDirectory = Join-Path $PWD 'build/distribution'
          $packageDirectory = Join-Path $distributionDirectory "flucord-windows-x64-$tag"
          New-Item -ItemType Directory -Path $distributionDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item -Path (Join-Path $releaseDirectory '*') -Destination $packageDirectory -Recurse -Force
          Copy-Item -LiteralPath 'LICENSE', 'NOTICE' -Destination $packageDirectory -Force

          $requiredFiles = @(
            'flucord.exe',
            'flutter_windows.dll',
            'data/flutter_assets/AssetManifest.bin',
            'LICENSE',
            'NOTICE'
          )
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $packageDirectory $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Release package is missing required file: $requiredFile"
            }
          }

          $archiveName = "flucord-windows-x64-$tag.zip"
          $archivePath = Join-Path $distributionDirectory $archiveName
          Compress-Archive -Path (Join-Path $packageDirectory '*') -DestinationPath $archivePath -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $distributionDirectory 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText(
            $checksumPath,
            "$hash  $archiveName`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          "archive=$archivePath" >> $env:GITHUB_OUTPUT
          "checksums=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Generate detailed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/scripts/build-release-notes.ps1 `
            -Tag '${{ github.ref_name }}' `
            -OutputPath 'build/distribution/RELEASE_NOTES.md'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $archive = '${{ steps.package.outputs.archive }}'
          $checksums = '${{ steps.package.outputs.checksums }}'
          $notes = 'build/distribution/RELEASE_NOTES.md'
          gh release view $tag --json id *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release edit $tag `
              --verify-tag `
              --latest `
              --title "Flucord $tag" `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update release $tag."
            }
            gh release upload $tag $archive $checksums --clobber
          } else {
            gh release create $tag $archive $checksums `
              --verify-tag `
              --latest `
              --title "Flucord $tag" `
              --notes-file $notes
          }
