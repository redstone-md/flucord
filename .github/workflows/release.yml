name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

# Three jobs where there was one: the checks are CI's own (audit, analyze,
# four test shards), the build runs beside them rather than after them, and
# only publishing waits for both. Measured against the single job: about
# nine minutes instead of seventeen.
jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      build: false
    permissions:
      contents: read

  build:
    name: Build and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # A fixed address: GitHub redirects it to the newest release's asset.
      FLUCORD_UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and project version
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$') {
            throw "Release tag must use exact vMAJOR.MINOR.PATCH syntax: $tag"
          }
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)(?:\+\d+)?\s*$'
          if ($versionLine.Matches.Count -ne 1) {
            throw 'pubspec.yaml must contain exactly one semantic version.'
          }
          $projectVersion = $versionLine.Matches[0].Groups[1].Value
          if ($projectVersion -ne $Matches.version) {
            throw "Tag $tag does not match pubspec version $projectVersion."
          }
          $tagType = git cat-file -t $tag
          if ($tagType -notin @('tag', 'commit')) {
            throw "Tag $tag does not resolve to a Git tag or commit."
          }

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          precache-windows: "true"

      - name: Build Windows release
        run: flutter build windows --release "--dart-define=FLUCORD_UPDATE_FEED_URL=$env:FLUCORD_UPDATE_FEED_URL"

      # Inno Setup ships on the hosted Windows images; the script wraps the
      # complete runtime directory the step above produced.
      - name: Build Windows installer
        run: |
          $tag = '${{ github.ref_name }}'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found at $iscc."
          }
          $installerName = "flucord-windows-x64-setup-$tag"
          & $iscc "/DAppVersion=$($tag.TrimStart('v'))" "/DOutputName=$installerName" 'windows/installer/flucord.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE."
          }
          $installerPath = Join-Path $PWD "build/distribution/$installerName.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced at $installerPath."
          }

      - name: Package release and checksums
        run: |
          $tag = '${{ github.ref_name }}'
          $releaseDirectory = Resolve-Path 'build/windows/x64/runner/Release'
          $distributionDirectory = Join-Path $PWD 'build/distribution'
          $packageDirectory = Join-Path $distributionDirectory "flucord-windows-x64-$tag"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item -Path (Join-Path $releaseDirectory '*') -Destination $packageDirectory -Recurse -Force
          Copy-Item -LiteralPath 'LICENSE', 'NOTICE' -Destination $packageDirectory -Force

          $requiredFiles = @(
            'flucord.exe',
            'flutter_windows.dll',
            'data/flutter_assets/AssetManifest.bin',
            'LICENSE',
            'NOTICE'
          )
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $packageDirectory $requiredFile
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Release package is missing required file: $requiredFile"
            }
          }

          $archivePath = Join-Path $distributionDirectory "flucord-windows-x64-$tag.zip"
          Compress-Archive -Path (Join-Path $packageDirectory '*') -DestinationPath $archivePath -CompressionLevel Optimal
          $installerPath = Join-Path $distributionDirectory "flucord-windows-x64-setup-$tag.exe"
          $checksums = ''
          foreach ($asset in @($installerPath, $archivePath)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            $checksums += "$hash  $(Split-Path -Leaf $asset)`n"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $distributionDirectory 'SHA256SUMS.txt'),
            $checksums,
            [System.Text.UTF8Encoding]::new($false)
          )

      # WinSparkle checks a DSA signature of the setup's SHA-1 against the
      # dsa_pub.pem built into the exe. Without the private key this release
      # ships with no appcast, so no installed build is offered it.
      - name: Sign the installer and write the appcast
        env:
          DSA_PRIVATE_KEY: ${{ secrets.FLUCORD_UPDATE_DSA_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DSA_PRIVATE_KEY)) {
            Write-Output '::warning title=No update feed::FLUCORD_UPDATE_DSA_PRIVATE_KEY is not set, so this release has no signed appcast and installed builds will not be offered it. See docs/DESKTOP_INTEGRATION.md.'
            exit 0
          }
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty Source
          if (-not $openssl) {
            $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          }
          if (-not (Test-Path -LiteralPath $openssl -PathType Leaf)) {
            throw 'OpenSSL was not found, so the installer cannot be signed.'
          }
          $tag = '${{ github.ref_name }}'
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)\s*$'
          $version = $versionLine.Matches[0].Groups[1].Value
          $installerPath = "build/distribution/flucord-windows-x64-setup-$tag.exe"
          $keyPath = Join-Path $env:RUNNER_TEMP 'dsa_priv.pem'
          $digestPath = Join-Path $env:RUNNER_TEMP 'installer.sha1'
          $signaturePath = Join-Path $env:RUNNER_TEMP 'installer.sig'
          [System.IO.File]::WriteAllText($keyPath, $env:DSA_PRIVATE_KEY)
          try {
            & $openssl dgst -sha1 -binary -out $digestPath $installerPath
            if ($LASTEXITCODE -ne 0) { throw 'Hashing the installer failed.' }
            & $openssl dgst -sha1 -sign $keyPath -out $signaturePath $digestPath
            if ($LASTEXITCODE -ne 0) { throw 'Signing the installer failed.' }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force
          }
          & $openssl dgst -sha1 -verify dsa_pub.pem -signature $signaturePath $digestPath
          if ($LASTEXITCODE -ne 0) {
            throw 'The signature does not verify with dsa_pub.pem, so the secret holds a different key.'
          }
          $signature = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($signaturePath))
          dart tool/write_appcast.dart `
            --repository '${{ github.repository }}' `
            --tag $tag `
            --version $version `
            --installer $installerPath `
            --signature $signature `
            --output build/distribution/appcast.xml
          if ($LASTEXITCODE -ne 0) {
            throw "Writing the appcast failed with exit code $LASTEXITCODE."
          }

      # Only the release assets: the unpacked package directory is the ZIP's
      # content twice over. appcast.xml is there only when the setup was signed.
      - name: Keep the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            build/distribution/flucord-windows-x64-setup-${{ github.ref_name }}.exe
            build/distribution/flucord-windows-x64-${{ github.ref_name }}.zip
            build/distribution/SHA256SUMS.txt
            build/distribution/appcast.xml

  publish:
    name: Publish GitHub release
    needs: [checks, build]
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      # The notes read the tag's history, so this job checks out all of it.
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: build/distribution

      - name: Generate detailed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/scripts/build-release-notes.ps1 `
            -Tag '${{ github.ref_name }}' `
            -OutputPath 'build/distribution/RELEASE_NOTES.md'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $installer = "build/distribution/flucord-windows-x64-setup-$tag.exe"
          $archive = "build/distribution/flucord-windows-x64-$tag.zip"
          $checksums = 'build/distribution/SHA256SUMS.txt'
          $notes = 'build/distribution/RELEASE_NOTES.md'
          $assets = @($installer, $archive, $checksums)
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
          }
          # The feed address built into the app names this asset of the
          # latest release.
          $appcast = 'build/distribution/appcast.xml'
          if (Test-Path -LiteralPath $appcast -PathType Leaf) {
            $assets += $appcast
          }
          gh release view $tag --json id *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release edit $tag `
              --verify-tag `
              --latest `
              --title "Flucord $tag" `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update release $tag."
            }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets `
              --verify-tag `
              --latest `
              --title "Flucord $tag" `
              --notes-file $notes
          }
