name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/release.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/release.yml"
  workflow_dispatch:
  # The release calls this for its checks, so a tag is tested by exactly the
  # workflow main is.
  workflow_call:
    inputs:
      build:
        description: Whether to build Windows too; the release builds on its own.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in
# progress; main is never cancelled so its history stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: Analyze and audit
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # The privacy audit reads the whole history, so this job alone checks
      # out all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Audit public repository history
        run: ./tool/audit_public_repository.ps1
      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test (shard ${{ matrix.shard }} of 4)
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Test
        run: >
          flutter test
          --reporter github
          --total-shards 4
          --shard-index ${{ matrix.shard }}

  native-test:
    name: Test native video
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >
          cmake -S windows/flucord_video -B build/flucord-video-test
          -DFLUCORD_VIDEO_BUILD_TESTS=ON
      - name: Build
        run: >
          cmake --build build/flucord-video-test --config Release
          --target flucord_video_clock_test
      - name: Test
        run: >
          ctest --test-dir build/flucord-video-test -C Release
          --output-on-failure

  build:
    name: Build Windows x64
    # A build break should surface on main, not at the release tag; pull
    # requests get analyze and tests, which is where nearly everything fails;
    # a manual dispatch builds too. A caller that builds for itself opts out.
    if: github.event_name != 'pull_request' && inputs.build != false
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          precache-windows: "true"
      - name: Build
        run: flutter build windows --release
