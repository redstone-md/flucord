name: flucord
description: A native Flutter desktop messaging client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  auto_updater: ^1.0.0
  file_picker: 11.0.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_webrtc: ^1.5.2
  local_notifier: ^0.1.6
  path_provider: ^2.1.6
  protocol_handler: ^0.2.0
  sqflite_common_ffi: ^2.4.2
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/app_icon.ico
